name: anitrail
description: "AniTrail"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.12.1
  geolocator: ^13.0.2
  google_sign_in: ^7.2.0
  provider: ^6.1.2
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^6.0.1
  http: ^1.2.2
  http_parser: ^4.1.2
  mime: ^2.0.0
  shared_preferences: ^2.3.0
  cached_network_image: ^3.4.0
  url_launcher: ^6.3.0
  google_fonts: ^8.1.0
  image_picker: 1.2.3
  flutter_svg: ^2.0.10
  dotted_border: ^3.1.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
